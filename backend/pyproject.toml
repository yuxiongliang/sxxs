[project]
name = "ant-design-pro-admin-api"
version = "0.1.0"
description = "FastAPI backend for the Ant Design Pro admin console"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.41.0",
  "sqlalchemy[asyncio]>=2.1.0",
  "asyncpg>=0.30.0",
  "pydantic[email]>=2.14.0",
  "pydantic-settings>=2.16.0",
  "python-multipart>=0.0.20",
  "structlog>=26.1.0",
  "alembic>=1.20.0",
  "pwdlib[argon2]>=0.3.1",
  "pyjwt>=2.15",
  "redis>=6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
